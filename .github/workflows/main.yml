name: NetworkSecurity CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  id-token: write
  contents: read

jobs:

  # --------------------------------------------------
  # TEMPORARY OIDC DEBUGGER
  # --------------------------------------------------
  oidc-debug:
    name: Debug GitHub OIDC
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get OIDC token claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Add base64 padding
          REMAINDER=$((${#PAYLOAD} % 4))
          if [ "$REMAINDER" -ne 0 ]; then
            PADDING=$((4 - REMAINDER))
            PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PADDING))"
          fi

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub, aud}'


  # --------------------------------------------------
  # CONTINUOUS INTEGRATION
  # --------------------------------------------------
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"


  # --------------------------------------------------
  # BUILD AND PUSH DOCKER IMAGE TO ECR
  # --------------------------------------------------
  build-and-push-ecr-image:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 740021355491.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: networksecurity
      IMAGE_TAG: latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::740021355491:role/GitHubActions-NetworkSecurity
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push Docker image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # --------------------------------------------------
  # DEPLOY TO EC2
  # --------------------------------------------------
  Continuous-Deployment:
    name: Deploy to EC2
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 740021355491.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: networksecurity
      IMAGE_TAG: latest
      CONTAINER_NAME: networksecurity-container

    steps:
      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region $AWS_REGION | \
            docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

      - name: Pull latest Docker image
        run: |
          docker pull \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Stop old container
        run: |
          docker rm -f $CONTAINER_NAME || true

      - name: Run new Docker container
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            --env-file /home/ec2-user/NetworkSecurity/.env \
            -p 8001:8000 \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Check container
        run: |
          docker ps
          docker logs --tail 50 $CONTAINER_NAME

      - name: Clean unused Docker resources
        run: |
          docker system prune -f